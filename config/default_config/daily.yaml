# config/default_config/daily.yaml
# autoMerge: 默认开启。插件更新后若默认配置新增字段，会自动合并进用户配置（config/config/daily.yaml），不会覆盖你已设置的值。
# 可在锅巴面板「其他配置」里开关；用户配置里的 autoMerge 优先级高于此处。
autoMerge: true
reportGroup: []
morningTime: "0 10 * * *"
eveningTime: "0 22 * * *"
customTitle: "芙芙心日报"
logoImage: "logo.png"
logoSize: ""
titleFont: "Title.ttf"
titleFontSize: ""
secondaryTitleFont: "Secondary_Title.ttf"
secondaryTitleFontSize: ""
contentFont: "Content.ttf"
contentFontSize: ""
# 下方热搜板块（抖音热搜 / 今日新番 / 头条热搜）三选一
hotModule: "douyin"
# 侧栏话题模块（知乎话题榜 / 哔哩哔哩热搜）二选一
sideModule: "zhihu"
# 渲染像素倍率（2 = 两倍图，1 = 原尺寸），仅在渲染后端不支持设备像素比时生效
renderScale: 2
# 图片压缩：compressImage 为 false 时直接输出渲染后端返回的原图；
# 格式支持 png-none(PNG 无压缩) / png(PNG 无损) / jpeg(JPEG) / webp(WebP)，quality 仅对 jpeg、webp 生效
compressImage: true
compressFormat: "png"
compressQuality: 80
# 各数据源的 API 地址，留空则自动在内置公共实例里挑选可用的
apiBase:
  viki: "https://60s.viki.moe"
  news60s: ""
  moyu: ""
  zhihu: ""
  itNews: ""
  douyin: ""
  toutiao: ""
  # 主域 60s.viki.moe 的 /v2/bili 长期返回 500，这里默认用实测可用的公共实例
  bilibili: "https://60s.7se.cn"
  bangumi: "https://api.bgm.tv"
theme: "blue"
